name: Package DeLorean Bedrock Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - "Bedrock-DeLorean/**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Behavior Pack
        run: |
          cd Bedrock-DeLorean/behavior_pack
          zip -r ../../DeLorean-Behavior.mcpack .
      - name: Package Resource Pack
        run: |
          cd Bedrock-DeLorean/resource_pack
          zip -r ../../DeLorean-Resources.mcpack .
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: DeLorean-Bedrock-mcpack
          path: |
            DeLorean-Behavior.mcpack
            DeLorean-Resources.mcpack
